version: "2"

linters:
  # "standard" is errcheck, govet, ineffassign, staticcheck and unused.
  default: standard
  enable:
    # The provider hands raw *http.Response values back from the generated
    # client; an unclosed body leaks a connection per call.
    - bodyclose
    - misspell
    # Same analyzer as the `modernize` / `modernize-check` make targets, but
    # versioned with golangci-lint instead of resolved at @latest, so a new
    # upstream release cannot redden an unrelated PR.
    - modernize
  exclusions:
    # internal/ddclient is a 3.5 MB oapi-codegen artifact regenerated by
    # `make regen-client`. Linting it produces findings nobody can act on
    # without editing generated code.
    paths:
      - internal/ddclient
    rules:
      # DefectDojo's own API spells this field "repsonse". The ddField tag must
      # match the ddclient field name exactly or the reflection engine fails at
      # apply time (and ddfield_audit_unit_test.go fails), and the tfsdk name is
      # a published attribute - renaming it would be a breaking change. Neither
      # can be corrected here; the typo belongs upstream.
      - path: internal/provider/system_settings_resource\.go
        linters:
          - misspell
        text: "`repsonse` is a misspelling"

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - internal/ddclient
