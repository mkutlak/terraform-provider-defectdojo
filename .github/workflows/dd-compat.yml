name: DefectDojo Compatibility

on:
  workflow_dispatch:
    inputs:
      dd_versions:
        description: "Comma-separated list of DefectDojo versions to test (e.g. 3.2.300,3.2.0 — 3.x only; 2.x is unsupported)"
        required: true
        default: "3.2.300"
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Build version matrix
        id: set-matrix
        env:
          DD_VERSIONS: ${{ inputs.dd_versions }}
        run: |
          VERSIONS=$(jq -Rs -c 'split(",") | map(gsub("\\s"; ""))' <<< "$DD_VERSIONS")
          # Each version goes into a shell command and a file path, so accept only digits and dots.
          if ! jq -e 'length > 0 and all(test("^[0-9]+(\\.[0-9]+)*$"))' <<< "$VERSIONS" > /dev/null; then
            echo "::error::dd_versions must be comma-separated versions, for example 3.2.300,3.2.0"
            exit 1
          fi
          echo "matrix={\"dd_version\":$VERSIONS}" >> "$GITHUB_OUTPUT"

  compat:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.14.*"
          terraform_wrapper: false

      - name: Start DefectDojo ${{ matrix.dd_version }}
        env:
          DD_VERSION: ${{ matrix.dd_version }}
        run: make dd-up

      - name: Fetch OpenAPI spec
        env:
          DD_VERSION: ${{ matrix.dd_version }}
        run: make dd-spec

      - name: Run acceptance tests
        run: make testacc-local
        env:
          TF_ACC: "1"

      - name: Upload OpenAPI spec
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-spec-${{ matrix.dd_version }}
          path: openapi-specs/${{ matrix.dd_version }}/defect_dojo.json
          retention-days: 90

      - name: Stop DefectDojo
        if: always()
        run: make dd-down
