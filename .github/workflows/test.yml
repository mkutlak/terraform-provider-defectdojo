# Terraform Provider testing workflow.
name: Tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
    # `labeled` matters: release-please applies the "autorelease: pending" label
    # after opening its PR, and that label is what widens the Terraform matrix
    # below. Without it the release PR would never get the full matrix.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Run acceptance tests against every supported Terraform version'
        type: boolean
        default: false

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

# Superseded runs are pointless once a PR is updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Default values to simplify job configurations below.
env:
  # Go language version to use for building. This value should also be updated
  # in the release workflow if changed.
  GO_VERSION: '1.26'

jobs:
  # Unit tests need no DefectDojo instance: TestMain short-circuits when TF_ACC
  # is unset. Keeping them in their own job means the ddField audits, the schema
  # meta-tests and the datetime tables still run when Docker fails to come up.
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - run: make test-unit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make fmtcheck
      - run: make vet
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.3

  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod download
      - run: go build -v .

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  # Normal PRs test one Terraform version; the release-please PR tests all of
  # them. This keeps PR feedback fast while still gating a release on the full
  # matrix. Computing the list here means there is exactly one acceptance job
  # definition rather than two near-identical workflows.
  matrix:
    name: Resolve Terraform matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      terraform: ${{ steps.set.outputs.terraform }}
    steps:
      - id: set
        env:
          # release-please-action@v5 labels its PR "autorelease: pending". The
          # branch prefix is a fallback: this repo configures a `component`, so
          # the generated branch name varies with release-please's config.
          # Folded scalar: the label text contains ": ", which plain YAML would
          # parse as a nested mapping.
          IS_RELEASE: >-
            ${{ contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
            || startsWith(github.head_ref, 'release-please--')
            || (github.event_name == 'workflow_dispatch' && inputs.full_matrix) }}
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            echo 'terraform=["1.10.*","1.12.*","1.14.*"]' >> "$GITHUB_OUTPUT"
            echo "Release PR detected: running the full Terraform matrix."
          else
            echo 'terraform=["1.14.*"]' >> "$GITHUB_OUTPUT"
            echo "Standard PR: running Terraform 1.14 only. The full matrix runs on the release PR."
          fi

  # Run acceptance tests against a live DefectDojo instance
  acceptance:
    name: Acceptance Tests (Terraform ${{ matrix.terraform }})
    needs: [build, matrix]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        terraform: ${{ fromJSON(needs.matrix.outputs.terraform) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - name: Start DefectDojo
        run: make dd-up
      - name: Run acceptance tests
        run: make testacc-local
        timeout-minutes: 25
      - name: DefectDojo logs
        if: failure()
        run: docker compose logs --tail=200 uwsgi nginx initializer
      - name: Stop DefectDojo
        if: always()
        run: make dd-down

  # OpenTofu implements the same plugin protocol, so the provider binary works
  # unchanged - but that is worth proving rather than assuming. One leg on
  # latest is enough: this guards protocol compatibility, not OpenTofu version
  # coverage, so it does not need the Terraform matrix treatment.
  acceptance-tofu:
    name: Acceptance Tests (OpenTofu latest)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: latest
          tofu_wrapper: false
      - run: go mod download
      # Resolved explicitly rather than left to the harness. If
      # TF_ACC_TERRAFORM_PATH were empty the harness would fall back to finding
      # or downloading Terraform, and this job would pass while testing the
      # wrong binary entirely.
      - name: Resolve OpenTofu binary
        run: |
          TOFU_PATH="$(command -v tofu)"
          echo "Using OpenTofu at $TOFU_PATH"
          "$TOFU_PATH" version
          echo "TF_ACC_TERRAFORM_PATH=$TOFU_PATH" >> "$GITHUB_ENV"
      - name: Start DefectDojo
        run: make dd-up
      - name: Run acceptance tests
        run: make testacc-local
        timeout-minutes: 25
        env:
          # Without this the harness generates provider addresses under
          # registry.terraform.io, and OpenTofu rejects them with "The legacy
          # provider namespace \"-\" can be used only with hostname
          # registry.opentofu.org". Every acceptance test fails at init.
          TF_ACC_PROVIDER_HOST: registry.opentofu.org
      - name: DefectDojo logs
        if: failure()
        run: docker compose logs --tail=200 uwsgi nginx initializer
      - name: Stop DefectDojo
        if: always()
        run: make dd-down
